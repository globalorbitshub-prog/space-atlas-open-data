# Refreshes the open data files from spaceatlas.space once a day and commits them only when they changed.
name: Refresh data
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download the latest files
        run: |
          set -euo pipefail
          curl -fsS --retry 3 -o data/space-atlas-organisations.csv https://spaceatlas.space/open-data/space-atlas-organisations.csv
          curl -fsS --retry 3 -o data/space-atlas-organisations.json https://spaceatlas.space/open-data/space-atlas-organisations.json
          # Never commit an empty or broken download.
          test "$(wc -l < data/space-atlas-organisations.csv)" -gt 1000
          python3 -c "import json; d=json.load(open('data/space-atlas-organisations.json')); assert d['count'] > 1000"
      - name: Commit if changed
        run: |
          git config user.name 'space-atlas-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data
          git diff --cached --quiet || git commit -m "Daily refresh $(date -u +%F)" && git push
